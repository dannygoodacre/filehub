services:
  nginx:
    image: nginx:alpine
    container_name: filehub-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./static:/var/www/static:ro
    depends_on:
      filehub-web:
        condition: service_started
      filehub-client:
        condition: service_started
    restart: unless-stopped
    networks:
      - filehub-network

  filehub-web:
    build:
      context: .
      dockerfile: FileHub.Web/Dockerfile
    container_name: filehub-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:3000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/filehub.db
      - ContentDirectory=/app/files
      - CorsAllowedOrigins=${CORS_ALLOWED_ORIGINS}
      - SeedUser__Username=${SEED_USER_USERNAME}
      - SeedUser__Password=${SEED_USER_PASSWORD}
      - RootUrl=${ROOT_URL}
      - Sqids__MinLength=${SQIDS_MIN_LENGTH}
      - Sqids__Alphabet={$SQIDS_ALPHABET}
    volumes:
      - ./data:/app/data
      - ./files:/app/files
    restart: unless-stopped
    networks:
      - filehub-network

  filehub-client:
    build:
      context: ./FileHub.Client
      args:
        VITE_API_URL: /api
    container_name: filehub-client
    environment:
      - PUBLIC_API_URL=https://localhost/api
      - HOST=0.0.0.0
      - PORT=3001
    restart: unless-stopped
    networks:
      - filehub-network

networks:
  filehub-network:
    driver: bridge
